[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onepanel-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer[all]",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "structlog",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-httpx", "ruff"]

[project.scripts]
"1panel" = "onepanel.cli:app"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
